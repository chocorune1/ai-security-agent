name: AI Security Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-scan:
    name: Scan Java, JavaScript, and JSP sources
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SECURITY_FAIL_ON: CRITICAL,HIGH
      REQUIRE_QWEN: "true"
      AI_SECURITY_DEBUG: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install scanner dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Build security knowledge index
        run: python app/build_rag.py

      - name: Scan repository
        run: python app/ci_scan.py --source-dir "$GITHUB_WORKSPACE"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-reports
          path: |
            reports/security_scan.json
            reports/security_report_*.html
          if-no-files-found: warn
          retention-days: 30

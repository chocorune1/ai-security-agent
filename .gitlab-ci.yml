workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

stages:
  - security

security_scan:
  stage: security
  image: python:3.11-slim
  timeout: 1h
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PYTHONDONTWRITEBYTECODE: "1"
    SECURITY_FAIL_ON: "CRITICAL,HIGH"
  cache:
    key:
      files:
        - requirements-ci.txt
    paths:
      - .cache/pip/
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-ci.txt
    - python app/build_rag.py
    - python app/ci_scan.py --source-dir "$CI_PROJECT_DIR"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/security_report_*.html
      - reports/security_scan.json
